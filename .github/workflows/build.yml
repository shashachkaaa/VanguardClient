name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
            submodules: 'recursive'
            fetch-depth: '0'

    - name: Override AndroidLibXrayLite with my fork
      uses: actions/checkout@v4
      with:
            repository: 'shashachkaaa/AndroidLibXrayLite'
            path: 'AndroidLibXrayLite'
            token: ${{ secrets.GITHUB_TOKEN }}
            fetch-depth: '0'

    - name: Fetch AndroidLibXrayLite tag
      run: |
            pushd AndroidLibXrayLite
            CURRENT_TAG=$(git describe --tags --abbrev=0)
            echo "Current tag in this repo: $CURRENT_TAG"
            echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
            popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
            repository: 'shashachkaaa/AndroidLibXrayLite'
            tag: ${{ env.CURRENT_TAG }}
            fileName: 'libv2ray.aar'
            out-file-path: V2rayNG/app/libs/

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        echo "WARD_NDK_VERSION=29.0.14206865" >> $GITHUB_ENV

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Setup Java
      uses: actions/setup-java@v5.6.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Restore signing keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.WARD_KEYSTORE_BASE64 }}
        RELEASE_TAG: ${{ inputs.release_tag }}
        # Через окружение, а не подстановкой в скрипт: в пароле могут быть кавычки
        WARD_KEYSTORE_PASSWORD: ${{ secrets.WARD_KEYSTORE_PASSWORD }}
        WARD_KEY_ALIAS: ${{ secrets.WARD_KEY_ALIAS }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          if [ -n "$RELEASE_TAG" ]; then
            echo "::error::Нет секрета WARD_KEYSTORE_BASE64 - релиз собирать нечем"
            exit 1
          fi
          echo "::warning::Нет секрета WARD_KEYSTORE_BASE64 - APK будет неподписанным"
          exit 0
        fi
        KEYSTORE_PATH="${{ github.workspace }}/V2rayNG/ward-release.jks"

        # Из секрета убираем переводы строк, возвраты каретки и пробелы: секрет
        # набирают руками, и перенос строки из редактора роняет декодирование
        printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n \t' | base64 -d > "$KEYSTORE_PATH" 2>/dev/null || {
          echo "::error::WARD_KEYSTORE_BASE64 не разбирается как base64 (длина секрета: ${#KEYSTORE_BASE64}). Пересоздайте его командой base64 -w0 ward-release.jks"
          exit 1
        }

        if [ ! -s "$KEYSTORE_PATH" ]; then
          echo "::error::После декодирования файл ключа пустой"
          exit 1
        fi

        # Пароль проверяем здесь: иначе ошибка всплывёт где-то в середине сборки
        if ! keytool -list -keystore "$KEYSTORE_PATH" \
              -storepass "$WARD_KEYSTORE_PASSWORD" \
              -alias "${WARD_KEY_ALIAS:-ward}" > /dev/null 2>&1; then
          echo "::error::Ключ не открывается: проверьте WARD_KEYSTORE_PASSWORD и WARD_KEY_ALIAS"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$WARD_KEYSTORE_PASSWORD" 2>&1 | head -20
          exit 1
        fi

        echo "WARD_KEYSTORE_FILE=$KEYSTORE_PATH" >> $GITHUB_ENV

    - name: Build APK
      env:
        WARD_KEYSTORE_PASSWORD: ${{ secrets.WARD_KEYSTORE_PASSWORD }}
        WARD_KEY_ALIAS: ${{ secrets.WARD_KEY_ALIAS }}
        WARD_KEY_PASSWORD: ${{ secrets.WARD_KEY_PASSWORD }}
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assembleGithubRelease

    # Сборка без ключа даёт файлы вида *-unsigned.apk, которые не установятся;
    # ловим это здесь, а не в отзывах пользователей
    - name: Verify APK signature
      run: |
        BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
        FAILED=0
        for apk in ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/github/release/*.apk; do
          echo "== $(basename "$apk")"
          if ! "$BUILD_TOOLS/apksigner" verify --print-certs "$apk"; then
            echo "::error::$(basename "$apk") не подписан"
            FAILED=1
          fi
        done
        exit $FAILED

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/github/release/*arm64-v8a*.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/github/release/*armeabi-v7a*.apk

    - name: Upload x86 APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: x86-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/github/release/*x86*.apk

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: universal-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/github/release/*universal*.apk

  sign-and-release:
    needs: build
    runs-on: ubuntu-26.04
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Sign APK files
        run: |
          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          mkdir -p release-files

          find release -type f -name '*.apk' | while read apk; do
            cp "$apk" release-files/
            gpg --batch --yes --local-user "$KEY" --detach-sign --output "release-files/$(basename "$apk").sig" "$apk"
          done

          # Контрольные суммы одним файлом: их удобно сверять после скачивания
          (cd release-files && sha256sum *.apk > SHA256SUMS.txt)

          gpg --armor --export "$KEY" > release-files/ward-public-key.asc

      - name: Upload APKs, signatures and public key to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release-files/*
          tag: ${{ inputs.release_tag }}
          file_glob: true
          prerelease: true
